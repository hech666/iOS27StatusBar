name: Build Tweak

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          
      - name: Setup SDK
        run: |
          cd $HOME/theos
          mkdir -p sdks
          cd sdks
          curl -L -o iPhoneOS16.5.sdk.tar.xz https://github.com/theos/sdks/releases/download/latest/iPhoneOS16.5.sdk.tar.xz || true
          if [ -f iPhoneOS16.5.sdk.tar.xz ]; then
            tar -xf iPhoneOS16.5.sdk.tar.xz
          else
            git clone --depth=1 https://github.com/theos/sdks.git .
          fi
          
      - name: Build Package
        run: |
          export THEOS=$HOME/theos
          export PATH="$THEOS/bin:$PATH"
          make package FINALPACKAGE=1
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios27statusbar-deb
          path: packages/*.deb
